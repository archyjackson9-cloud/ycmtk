
# The app image is prebuilt and published to GitHub Container Registry by
# .github/workflows/docker-publish.yml (Docker Manager cannot build from source).
#
# Every variable below is declared explicitly per service (rather than a
# single `env_file: .env` reference, and without YAML anchors/merge keys)
# on purpose - both are compatibility risks with third-party compose
# parsers: a freshly cloned repo has no `.env` file at all (it's
# gitignored, correctly - it would hold real secrets), so `env_file:`
# pointing at a path that doesn't exist yet can make a deploy tool fail to
# load the project before you ever get a chance to supply one; YAML
# anchors are valid Compose Spec but not every third-party parser supports
# them. `${VAR}` substitution just resolves to blank/its default when
# unset - harmless until you provide real values, either via a `.env` file
# placed next to this one (see DEPLOYMENT.md) or through your platform's
# own environment-variables UI if it has one.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/archyjackson9-cloud/ycmtk:latest}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: ${APP_NAME:-CY-Market}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-cymarket}
      DB_USERNAME: ${DB_USERNAME:-cymarket}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CY-Market}
      VITE_APP_NAME: ${VITE_APP_NAME:-CY-Market}
      CYMARKET_DEFAULT_DELIVERY_FEE: ${CYMARKET_DEFAULT_DELIVERY_FEE:-15.00}
      CYMARKET_PILOT_ZONE_NAME: ${CYMARKET_PILOT_ZONE_NAME:-Tarkwa & Surrounding Communities}
      CYMARKET_STOCK_RESERVATION_MINUTES: ${CYMARKET_STOCK_RESERVATION_MINUTES:-15}
      CYMARKET_ABANDONED_CART_HOURS: ${CYMARKET_ABANDONED_CART_HOURS:-48}
      CYMARKET_ORDER_ESCALATION_HOURS: ${CYMARKET_ORDER_ESCALATION_HOURS:-6}
      CYMARKET_CURRENCY: ${CYMARKET_CURRENCY:-GHS}
      MOMO_MODE: ${MOMO_MODE:-simulate}
      MOMO_ENVIRONMENT: ${MOMO_ENVIRONMENT:-sandbox}
      MOMO_BASE_URL: ${MOMO_BASE_URL:-https://sandbox.momodeveloper.mtn.com}
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY:-}
      MOMO_API_USER: ${MOMO_API_USER:-}
      MOMO_API_KEY: ${MOMO_API_KEY:-}
      MOMO_CURRENCY: ${MOMO_CURRENCY:-GHS}
      MOMO_CALLBACK_URL: ${MOMO_CALLBACK_URL:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SMS_MODE: ${SMS_MODE:-log}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-}
      SMS_GATEWAY_API_KEY: ${SMS_GATEWAY_API_KEY:-}
      SMS_GATEWAY_CLIENT_ID: ${SMS_GATEWAY_CLIENT_ID:-}
      SMS_GATEWAY_SENDER_ID: ${SMS_GATEWAY_SENDER_ID:-CYMarket}
      SMS_RETRY_ATTEMPTS: ${SMS_RETRY_ATTEMPTS:-3}
      FILAMENT_DOMAIN: ${FILAMENT_DOMAIN:-}
      FILAMENT_PATH: ${FILAMENT_PATH:-admin}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      - db

  # Same image as `app`, just running Laravel's scheduler loop instead of
  # Apache (TOR §11 - expired reservations, abandoned carts, stale orders).
  scheduler:
    image: ${APP_IMAGE:-ghcr.io/archyjackson9-cloud/ycmtk:latest}
    restart: unless-stopped
    command: ["/usr/local/bin/scheduler.sh"]
    environment:
      APP_NAME: ${APP_NAME:-CY-Market}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-cymarket}
      DB_USERNAME: ${DB_USERNAME:-cymarket}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CY-Market}
      VITE_APP_NAME: ${VITE_APP_NAME:-CY-Market}
      CYMARKET_DEFAULT_DELIVERY_FEE: ${CYMARKET_DEFAULT_DELIVERY_FEE:-15.00}
      CYMARKET_PILOT_ZONE_NAME: ${CYMARKET_PILOT_ZONE_NAME:-Tarkwa & Surrounding Communities}
      CYMARKET_STOCK_RESERVATION_MINUTES: ${CYMARKET_STOCK_RESERVATION_MINUTES:-15}
      CYMARKET_ABANDONED_CART_HOURS: ${CYMARKET_ABANDONED_CART_HOURS:-48}
      CYMARKET_ORDER_ESCALATION_HOURS: ${CYMARKET_ORDER_ESCALATION_HOURS:-6}
      CYMARKET_CURRENCY: ${CYMARKET_CURRENCY:-GHS}
      MOMO_MODE: ${MOMO_MODE:-simulate}
      MOMO_ENVIRONMENT: ${MOMO_ENVIRONMENT:-sandbox}
      MOMO_BASE_URL: ${MOMO_BASE_URL:-https://sandbox.momodeveloper.mtn.com}
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY:-}
      MOMO_API_USER: ${MOMO_API_USER:-}
      MOMO_API_KEY: ${MOMO_API_KEY:-}
      MOMO_CURRENCY: ${MOMO_CURRENCY:-GHS}
      MOMO_CALLBACK_URL: ${MOMO_CALLBACK_URL:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SMS_MODE: ${SMS_MODE:-log}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-}
      SMS_GATEWAY_API_KEY: ${SMS_GATEWAY_API_KEY:-}
      SMS_GATEWAY_CLIENT_ID: ${SMS_GATEWAY_CLIENT_ID:-}
      SMS_GATEWAY_SENDER_ID: ${SMS_GATEWAY_SENDER_ID:-CYMarket}
      SMS_RETRY_ATTEMPTS: ${SMS_RETRY_ATTEMPTS:-3}
      FILAMENT_DOMAIN: ${FILAMENT_DOMAIN:-}
      FILAMENT_PATH: ${FILAMENT_PATH:-admin}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      - db

  # No jobs are dispatched onto the queue yet (everything in this app runs
  # synchronously), so this is a cheap, idle safety net for when that
  # changes rather than something load-bearing today. Remove this service
  # if you'd rather not run it until it's actually needed.
  queue:
    image: ${APP_IMAGE:-ghcr.io/archyjackson9-cloud/ycmtk:latest}
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--sleep=3"]
    environment:
      APP_NAME: ${APP_NAME:-CY-Market}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-cymarket}
      DB_USERNAME: ${DB_USERNAME:-cymarket}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CY-Market}
      VITE_APP_NAME: ${VITE_APP_NAME:-CY-Market}
      CYMARKET_DEFAULT_DELIVERY_FEE: ${CYMARKET_DEFAULT_DELIVERY_FEE:-15.00}
      CYMARKET_PILOT_ZONE_NAME: ${CYMARKET_PILOT_ZONE_NAME:-Tarkwa & Surrounding Communities}
      CYMARKET_STOCK_RESERVATION_MINUTES: ${CYMARKET_STOCK_RESERVATION_MINUTES:-15}
      CYMARKET_ABANDONED_CART_HOURS: ${CYMARKET_ABANDONED_CART_HOURS:-48}
      CYMARKET_ORDER_ESCALATION_HOURS: ${CYMARKET_ORDER_ESCALATION_HOURS:-6}
      CYMARKET_CURRENCY: ${CYMARKET_CURRENCY:-GHS}
      MOMO_MODE: ${MOMO_MODE:-simulate}
      MOMO_ENVIRONMENT: ${MOMO_ENVIRONMENT:-sandbox}
      MOMO_BASE_URL: ${MOMO_BASE_URL:-https://sandbox.momodeveloper.mtn.com}
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY:-}
      MOMO_API_USER: ${MOMO_API_USER:-}
      MOMO_API_KEY: ${MOMO_API_KEY:-}
      MOMO_CURRENCY: ${MOMO_CURRENCY:-GHS}
      MOMO_CALLBACK_URL: ${MOMO_CALLBACK_URL:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SMS_MODE: ${SMS_MODE:-log}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-}
      SMS_GATEWAY_API_KEY: ${SMS_GATEWAY_API_KEY:-}
      SMS_GATEWAY_CLIENT_ID: ${SMS_GATEWAY_CLIENT_ID:-}
      SMS_GATEWAY_SENDER_ID: ${SMS_GATEWAY_SENDER_ID:-CYMarket}
      SMS_RETRY_ATTEMPTS: ${SMS_RETRY_ATTEMPTS:-3}
      FILAMENT_DOMAIN: ${FILAMENT_DOMAIN:-}
      FILAMENT_PATH: ${FILAMENT_PATH:-admin}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      - db

  # TLS-terminating reverse proxy: obtains and renews the Let's Encrypt
  # certificate automatically and forwards to the app container. Needs the
  # domain's DNS A record pointing at this VPS and ports 80/443 free.
  # No Caddyfile needed - the command line is the whole config.
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${SITE_DOMAIN:-cy-market.com}", "--to", "app:80"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cymarket}
      MYSQL_USER: ${DB_USERNAME:-cymarket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-too}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change-me-too}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-storage:
  db-data:
  caddy-data:
  caddy-config:
