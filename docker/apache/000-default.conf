<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Debian's apache2 package ships a global `Alias /icons/ ...` pointing
    # at /usr/share/apache2/icons (mod_autoindex's fancy-indexing icons,
    # unused here - we set Options -Indexes below). That alias silently
    # intercepts every request under /icons/ before Apache ever looks at
    # DocumentRoot, which happens to be exactly where the PWA icons live
    # (public/icons/*) - redefined here, inside the vhost, so it points at
    # our own folder instead and actually gets served.
    Alias /icons/ /var/www/html/public/icons/
    <Directory /var/www/html/public/icons>
        Require all granted
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
