<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — CY-Market</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #052312 0%, #14532d 55%, #16a34a 100%);
        color: #fff;
        text-align: center;
        padding: 24px;
    }
    .card {
        max-width: 380px;
    }
    .badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #16a34a, #14532d);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        margin: 0 auto 20px;
        border: 1px solid rgba(255,255,255,0.2);
    }
    h1 { font-size: 20px; margin: 0 0 10px; font-weight: 800; }
    p { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.75); margin: 0 0 24px; }
    button {
        background: #fff;
        color: #14532d;
        border: none;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
    }
    button:active { transform: scale(0.97); }
</style>
</head>
<body>
    <div class="card">
        <div class="badge">CY</div>
        <h1>You're offline</h1>
        <p>We couldn't reach CY-Market. Check your connection - your cart and any order you've already placed are safe and will be here when you're back online.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
